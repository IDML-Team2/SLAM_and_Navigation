# Your robot – the ONE place where you describe it: which robot (namespace)
# and its geometry (lidar position, size).
#
# Namespace: the prefix of all Create3 topics, e.g. /Team1/odom, /Team1/cmd_vel.
# It must be the same as in the Create3's web interface. To see which namespace
# your robot uses:  ros2 topic list | grep odom
# (The ROS_DOMAIN_ID cannot be set here – it is set in ~/.bashrc, see the tutorial.)

namespace: /Robi2

# Geometry:
#
# Units: centimeters and degrees.
# Reference point: the robot center (frame base_link) = the middle point between
# the two drive wheels, which is also the center of the round Create3 body.
# Directions: x = forward, y = left, z = up.
#
#                    front (bumper)
#                         +x
#                          ▲
#                          │
#              +y ◀────────●────────  -y
#              left        │ center    right
#                          │
#                         -x
#
# Used by:
#   robot.launch.py / mapping.launch.py  (Jetson): "namespace", "lidar" -> odometry topic, TF base_link -> laser
#   navigation.launch.py                 (PC):     "namespace", "robot", "navigation", "lidar" -> Nav2
# Keep this file IDENTICAL on the Jetson and the PC.
# No rebuild needed after changes (symlink install) – just restart the launch file.

lidar:
  x_cm: 1.0                 # center of the lidar in front of (+) / behind (-) the robot center
  y_cm: -1.0                 # left (+) / right (-) of the robot center
  z_cm: 13.5                # height of the lidar's measuring plane (hardly matters for 2D)
  yaw_deg: 180.0             # where the lidar's 0-degree direction points:
                            #   0 = forward, 180 = backward, 90 = left, -90 = right
  ignore_closer_than_cm: 12 # readings closer than this to the lidar are ignored by Nav2
                            # (they usually hit the robot itself, e.g. the lidar mount)

camera:                     # RealSense; remove this section if no camera is mounted
  frame: camera_link        # root frame of the RealSense driver (default 'camera_link')
  x_cm: 10.0                # TODO measure: center of the camera in front of (+) / behind (-) the robot center
  y_cm: 0.0                 # TODO measure: left (+) / right (-) of the robot center
  z_cm: 20.0                # TODO measure: height of the camera above the floor
  yaw_deg: 0.0              # where the camera looks: 0 = forward, 180 = backward, 90 = left
  pitch_deg: 0.0            # tilt: positive = looking DOWN toward the floor

robot:
  radius_cm: 17.1           # Create3 body: 34.2 cm diameter
  footprint_cm: []          # OPTIONAL: outline of the robot, if parts stick out of the
                            # circle (e.g. a larger top plate). Corner points (x, y) in cm,
                            # going around the robot. If set, radius_cm is not used. Example:
                            #   footprint_cm: [[22, 15], [22, -15], [-17, -15], [-17, 15]]
  safety_margin_cm: 2       # added all around the radius / outline

navigation:
  # How close may the robot drive past obstacles? (The robot center never comes
  # closer than radius + safety margin; these two values decide how much it
  # tries to keep MORE distance.)
  inflation_cm: 30          # obstacles "cost" something up to this distance from them;
                            # the planner keeps the robot away from walls within this zone.
                            # Must be larger than the robot radius (+ safety margin).
                            # Smaller = robot drives closer to walls / through narrower gaps.
  cost_scaling_factor: 16   # how fast the cost falls off with distance (typical 3...20).
                            # Larger = cost near obstacles is lower = robot drives closer.
  path_keep_away: 1.0       # how strongly the PLANNER avoids paths near obstacles
                            # (typical 1...3). Smaller = shorter paths closer to walls.
